name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts bigdata
      - name: Test
        run: pytest
      - name: Pipeline smoke test
        run: basketlens run --output /tmp/out --dashboard /tmp/basketlens_data.js
      - name: MapReduce smoke test
        run: bash bigdata/mapreduce/run_streaming.sh --local country | head -5
